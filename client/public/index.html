<!DOCTYPE html>
<!--
  HTML TEMPLATE for the Homey client.

  Consumed by HtmlWebpackPlugin (client/webpack.config.js), which injects the
  compiled bundle script tag and writes the result to client/dist/index.html.
  The only markup that matters is the #root container that client/src/index.tsx
  mounts the React tree into.

  The inline styles are a minimal reset plus the page background, kept here so
  the shell is painted before the bundle loads and the app's own stylesheet
  (client/src/index.css) is applied.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roommate Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
